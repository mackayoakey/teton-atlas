<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teton Atlas V16</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5e2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>try{var _th=localStorage.getItem('teton-theme')||'auto';document.documentElement.setAttribute('data-theme',_th==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):_th)}catch(e){}</script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
:root{--ink:#1b1b1b;--muted:#6b6f6b;--line:#e7e7e3;--bg:#fff;--soft:#f4f4f1;--green:#1f5e2c;--lime:#aef07f;--pill:#151515;--red:#d62828;--orange:#f77f00;--blue:#1e88e5}
html[data-theme=dark]{--ink:#ecece8;--muted:#a3a7a2;--line:#3a3e40;--bg:#1d2022;--soft:#2a2e30;--green:#7cc98a;--lime:#aef07f;--pill:#0d0e0f;color-scheme:dark}
html[data-theme=dark] body{background:#111}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:var(--soft);color:var(--ink);border-color:var(--line)}
html[data-theme=dark] .mapbtn,html[data-theme=dark] .chips button,html[data-theme=dark] .btn,html[data-theme=dark] .pop,html[data-theme=dark] #menu,html[data-theme=dark] .hcard,html[data-theme=dark] .hstrip{background:var(--bg);color:var(--ink)}
html[data-theme=dark] .btn.primary,html[data-theme=dark] .chips button.on{background:var(--lime);color:#111;border-color:var(--lime)}
html[data-theme=dark] .maplibregl-popup-content{background:var(--bg);color:var(--ink)}
html[data-theme=dark] .maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--bg)}
html[data-theme=dark] .maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--bg)}
html[data-theme=dark] [style*="background:#fff4e5"],html[data-theme=dark] [style*="background:#fff1e0"]{background:#3b3022!important}
html[data-theme=dark] [style*="background:#e5f6e8"],html[data-theme=dark] [style*="background:#e5f4df"],html[data-theme=dark] [style*="background:#f6f8f4"]{background:#22352a!important}
html[data-theme=dark] [style*="background:#fde8ec"]{background:#3b2428!important}
html[data-theme=dark] [style*="background:#e3eef9"]{background:#22313f!important}
html[data-theme=dark] [style*="background:#fff"],html[data-theme=dark] .chart svg path[fill="#f2f2ee"]{background-color:var(--bg)}
html[data-theme=dark] .chart svg path[fill="#f2f2ee"]{fill:#2a2e30}
html[data-theme=dark] .chart svg path[stroke="#1b1b1b"],html[data-theme=dark] .chart svg line[stroke="#1b1b1b"]{stroke:#ecece8}
html[data-theme=dark] .chart svg line[stroke="#e3e3df"]{stroke:#3a3e40}
@media print{html[data-theme=dark]{--ink:#1b1b1b;--muted:#6b6f6b;--line:#e7e7e3;--bg:#fff;--soft:#f4f4f1;--green:#1f5e2c}html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#fff;color:#1b1b1b}}
#toolbar.ctx{background:var(--bg);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25);border:1px solid var(--line);gap:2px;padding:6px 8px;max-width:calc(100vw - 440px);overflow-x:auto;scrollbar-width:none;align-items:center}
#toolbar.ctx::-webkit-scrollbar{display:none}
#toolbar.ctx button{width:auto;min-width:56px;height:54px;border-radius:12px;background:transparent;color:var(--ink);flex-direction:column;gap:1px;padding:4px 6px;flex:none}
#toolbar.ctx button:hover{background:var(--soft)}
#toolbar.ctx button i{font-style:normal;font-size:19px;line-height:1}
#toolbar.ctx button em{font-style:normal;font-size:11px;font-weight:600;white-space:nowrap}
#toolbar.ctx button.on{background:var(--ink);color:var(--bg)}
#toolbar.ctx button.snapon{background:rgba(46,125,50,.16);color:#2e7d32}
html[data-theme=dark] #toolbar.ctx button.snapon{color:#8fe39a}
body:has(#toolbar.ctx) #sideBody{padding-bottom:96px}
#toolbar.ctx button.pri{background:#1e6fe0;color:#fff}
#toolbar.ctx button:disabled{opacity:.35;cursor:default}
#toolbar.ctx .tbtag{font-size:11px;font-weight:700;color:#1e6fe0;padding:0 8px;white-space:nowrap}
body.collapsed #toolbar.ctx{max-width:calc(100vw - 40px)}
.hm.j{background:#1e6fe0;font-size:18px}
.hstrip{position:relative;height:96px;background:var(--soft);border-radius:12px;margin:8px 0 2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:visible}
.hstrip svg{position:absolute;inset:0;width:100%;height:100%;border-radius:12px}
.hs-h{position:absolute;top:-6px;bottom:-6px;width:34px;margin-left:-17px;display:flex;justify-content:center;cursor:ew-resize;touch-action:none}
.hs-h::before{content:"";position:absolute;top:6px;bottom:6px;width:3px;background:#2e7d32;border-radius:2px}
.hs-h.b::before{background:#c62828}
.hs-h b{position:absolute;top:-2px;width:24px;height:24px;border-radius:50%;background:#2e7d32;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hs-h.b b{background:#c62828}
.hs-h.sel b{outline:3px solid #ffeb3b}
.hs-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 2px 10px}
.hs-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.hsum{background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.tabs2{display:flex;gap:6px;margin:4px 0 8px}
.tabs2 button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 8px;font-weight:700}
.tabs2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
.pills.three{grid-template-columns:1fr 1fr 1fr}
.pills button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pills button i{font-style:normal;font-size:18px}
.pills button.on{border-color:#1e6fe0;background:rgba(30,111,224,.12);box-shadow:inset 0 0 0 1px #1e6fe0}
.hcard{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.hcard.on{border-color:#ffb300;box-shadow:inset 0 0 0 1px #ffb300}
.hc-top{display:flex;align-items:center;gap:10px}
.hdot{width:26px;height:26px;border-radius:50%;background:#2e7d32;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}.hdot.b{background:#c62828}
.hc-nudge{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}.hc-nudge .btn{flex:1;min-width:58px}
.hc-fine{display:flex;align-items:center;gap:8px}.hc-fine input{flex:1;padding:0}
.htime{width:128px;flex:none}
.btn.big{width:100%;padding:13px;font-size:15px}
.btn:disabled{opacity:.45}
.segc{display:flex}
@media(max-width:800px){#toolbar.ctx{left:50%;max-width:calc(100vw - 16px)}}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#ddd}
#map{position:absolute;top:0;bottom:0;left:400px;right:0;transition:left .25s ease}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body,#side,.pop,#toolbar,#toast,.mapbtn,#collapseBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select,#sideBody p,#sideBody .t,#sideBody textarea{-webkit-user-select:text;user-select:text}
input,select,textarea{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}

/* Sidebar */
#side{position:absolute;top:0;bottom:0;left:0;width:400px;background:var(--bg);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:5;transition:transform .25s ease}
#collapseBtn{position:absolute;z-index:6;top:50%;left:400px;transform:translateY(-50%);width:24px;height:56px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:#fff;box-shadow:3px 0 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:left .25s ease;padding:0}
#collapseBtn svg{transition:transform .25s ease}
body.collapsed #side{transform:translateX(-100%)}
body.collapsed #map{left:0}
body.collapsed #collapseBtn{left:0}
body.collapsed #collapseBtn svg{transform:rotate(180deg)}
body.collapsed #toolbar,body.collapsed #toast{left:50%}
#menu .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.banner{margin:0 16px 8px;background:#fff4e5;color:#7a3e00;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
.banner .btn{flex:none}
.pbar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:5px}
.pbar.big{height:10px;margin:0 0 10px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:4px}
.cardx{display:flex;align-items:center}
.cardx .card{flex:1;min-width:0}
.yrsel{cursor:pointer;border-radius:8px}
.yrsel.on{background:var(--soft)}
.yrsel.on span:first-child{font-weight:800}
@media print{
  #map,#toolbar,#viewCtl,#menu,#layers,#markers,#markersBtn,#menuBtn,#layersBtn,#collapseBtn,#toast,nav.tabs,.search,#side header,.actions,.back,.btn,.x,.ph-x,.chips,.photos,.stats .muted{display:none!important}
  #side{position:static!important;width:auto!important;height:auto!important;border:0!important;transform:none!important;display:block!important;background:#fff}
  html,body{height:auto!important;overflow:visible!important;background:#fff}
  #sideBody{overflow:visible!important;padding:0!important}
}
.ph-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:16px;line-height:1;padding:0}
#menu .mh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 12px 2px}
#side header{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
#side header svg{flex:none}
#side header h1{font-size:20px;margin:0;letter-spacing:-.01em}
.hm{width:26px;height:26px;border-radius:50%;background:#2e7d32;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:grab}.hm.b{background:#c62828}.hm.sel{outline:3px solid #ffeb3b}
.chip-v{font-size:11px;background:var(--soft);border-radius:999px;padding:2px 8px;color:var(--muted)}
.search{padding:6px 20px 10px;position:relative}
.search input{border-radius:999px;padding:10px 16px 10px 38px;background:var(--soft);border-color:transparent}
.search svg{position:absolute;left:34px;top:18px}
nav.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#sideBody{flex:1;overflow:auto;padding:0 20px 120px}

/* Generic pieces */
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#174a22}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111}
.btn.wide{display:block;width:100%;text-align:center;background:#e9e9e6;border:0;padding:14px;font-size:16px;margin:14px 0}
.btn.wide:hover{background:#dededa}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2.sec{font-size:20px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.empty{color:var(--muted);padding:18px 0}

/* List cards */
.card{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover{background:linear-gradient(90deg,transparent,var(--soft),transparent)}
.card .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.card .tx{flex:1;min-width:0}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px}
.badge{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.badge.been{background:#e5f6e8;color:#1b7a34}
.badge.seen{background:#fff1e0;color:#b45309}
.badge.want{background:#fde8ec;color:#c2185b}

/* Detail page */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:14px 0 4px;color:var(--muted);font-weight:600}
.d-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.d-sub{color:var(--muted);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:10px;margin:16px 0 34px}
.stats.three{grid-template-columns:repeat(3,auto)}
.stat b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat b small{font-size:15px;font-weight:600;margin-left:3px}
.stat div{color:var(--muted);font-size:13px;margin-top:2px}
.chart{position:relative;margin:4px 0 0}
.chart svg{width:100%;height:190px;display:block;overflow:visible;touch-action:pan-y}
.chart .tip{position:absolute;top:-6px;background:var(--pill);color:#fff;font-size:12px;border-radius:8px;padding:3px 8px;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.seg{display:flex;gap:12px;padding:12px 0}
.seg i{flex:none;width:5px;border-radius:4px}
.seg .n{font-size:17px;font-weight:600}
.seg .m{display:flex;flex-wrap:wrap;gap:14px;color:#444;margin-top:2px}
.actions{display:flex;justify-content:center;gap:14px;background:var(--pill);border-radius:999px;padding:10px 16px;margin:14px auto;width:max-content}
.actions button{width:52px;height:52px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center}
.actions button:hover{background:#3a3a3a}
.actions button.on,.actions button.go{background:var(--lime);color:#111}
.visit{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.visit .tx{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{background:var(--soft);border-radius:14px;padding:14px}
.tile b{font-size:24px;font-weight:800;display:block}
.tile span{font-size:12px;color:var(--muted)}
.yr{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.wp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.wp .num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.wp .num.brk{background:var(--orange)}
.toggle{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:500}
.toggle input{width:auto}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.history li{margin:4px 0}

/* Map overlays */
.mapbtn{position:absolute;z-index:6;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.mapbtn:hover{background:var(--soft)}
#menuBtn{right:14px}
#layersBtn{right:66px}
.pop{position:absolute;z-index:7;top:66px;right:14px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:14px;max-height:calc(100vh - 90px);overflow:auto}
#menu{width:260px;padding:8px}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#layers{width:300px}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bases button{border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 0 6px;font-size:12px;font-weight:600;overflow:hidden}
.bases button i{display:block;height:58px;margin-bottom:5px;position:relative;overflow:hidden}
.bases button i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bases button.on{border-color:var(--green)}
#toolbar{position:absolute;z-index:6;bottom:22px;left:calc(200px + 50%);transform:translateX(-50%);transition:left .25s ease;display:flex;gap:10px;background:var(--pill);border-radius:999px;padding:9px 12px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toolbar button{width:50px;height:50px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
#toolbar button:hover{background:#3a3a3a}
#toolbar button.on{background:var(--lime);color:#111}
#toolbar button span{position:absolute;bottom:-26px;font-size:11px;color:#fff;background:var(--pill);padding:1px 6px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap}
#toolbar button:hover span{opacity:1}
#toast{position:absolute;z-index:8;top:16px;left:calc(200px + 50%);transform:translateX(-50%);background:var(--pill);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;max-width:60vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pinw{position:relative;cursor:pointer}
.pin{--s:32px;width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.4);box-sizing:border-box}
.pin.s{--s:24px}.pin.l{--s:44px}
.pin.drop{border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.pin.drop span{transform:rotate(45deg)}
.pin.circle{border-radius:50%}
.pin.square{border-radius:9px}
.pin span{font-size:calc(var(--s) * .5);line-height:1}
.pinw.sel .pin{outline:3px solid var(--lime)}
.pl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-style:normal;font-size:11.5px;font-weight:700;color:#1b1b1b;white-space:nowrap;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff;pointer-events:none}
.own{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin:0 0 8px}
.own.orig{background:#e3eef9;color:#1e5a8e}.own.mine{background:#e5f4df;color:#2e6b1f}
#markersBtn{right:118px}
#viewCtl{position:absolute;z-index:5;top:124px;right:14px;display:flex;flex-direction:column;gap:8px}
#viewCtl button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);font-weight:800;font-size:15px;line-height:1}
#viewCtl button:hover{background:var(--soft)}
#viewCtl[hidden]{display:none}
#markers{width:310px}
.wpm{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:grab}
.wpm.first{border-color:var(--green)}
.wpm.brk{border-color:var(--orange);width:20px;height:20px}
.maplibregl-ctrl-bottom-right{bottom:0}
#toast .tact{margin-left:10px;border:0;border-radius:999px;background:var(--lime);color:#111;font-weight:700;padding:5px 12px}
#toast .tx{display:inline-block;margin-left:8px;opacity:.7;font-size:16px;vertical-align:middle}
details.set{border-top:1px solid var(--line);padding:0}
details.set>summary,details.sub2>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-weight:700}
details.sub2>summary{font-weight:600;font-size:13px;color:var(--muted);padding:8px 0}
details>summary::-webkit-details-marker{display:none}
details.set>summary::after,details.sub2>summary::after{content:'›';font-size:20px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(-90deg)}
details.set>summary .sv{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted);max-width:50%;text-align:right}
details.set[open]{padding-bottom:6px}
#topbar{display:none}
@media (max-width:800px){
  :root{--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);--bar:calc(var(--sat) + 56px)}
  html,body{height:100%}
  @supports (height:1dvh){html,body{height:100dvh}}
  /* Top bar: fills the area behind the status bar / dynamic island */
  #topbar{display:flex;position:absolute;z-index:4;top:0;left:0;right:0;height:var(--bar);padding:var(--sat) 14px 0;align-items:center;gap:10px;background:var(--green);color:#fff}
  #topbar svg{flex:none}
  #topbar b{font-size:18px;letter-spacing:-.01em}
  #topbar .chip-v{background:rgba(255,255,255,.18);color:#fff}
  #map{left:0;top:var(--bar);bottom:0;transition:none}
  /* The panel: closed = only a tab at the very bottom; open = the whole screen under the top bar */
  #side{top:var(--bar);bottom:0;left:0;width:100%;height:auto;border:0;border-radius:0}
  #side header{display:none}
  .search{padding-top:30px}
  #sideBody{padding-bottom:calc(60px + var(--sab))}
  body.collapsed #side{transform:translateY(100%)}
  #collapseBtn{top:var(--bar);bottom:auto;left:50%;transform:translateX(-50%);width:76px;height:28px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;z-index:7;transition:none}
  #collapseBtn svg{transform:rotate(-90deg)}
  body.collapsed #collapseBtn{top:auto;bottom:0;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;left:50%}
  body.collapsed #collapseBtn svg{transform:rotate(90deg)}
  #toolbar{left:50%;bottom:calc(var(--sab) + 44px);gap:8px;padding:7px 9px}

  body:not(.collapsed) #toast{display:none}
  details.set>summary{padding:12px 0}
  details.set>label.f:first-of-type,details.set>p:first-of-type{margin-top:0}
  #toolbar button{width:46px;height:46px}
  .mapbtn{top:calc(var(--sat) + 6px);z-index:6}
  .pop{top:calc(var(--bar) + 6px);max-height:calc(100vh - var(--bar) - 20px - var(--sab))}
  @supports (height:1dvh){.pop{max-height:calc(100dvh - var(--bar) - 20px - var(--sab))}}
  #layers,#markers{width:min(310px,calc(100vw - 28px))}
  #toast{left:50%;top:calc(var(--bar) + 10px);max-width:88vw;border-radius:18px}
  input,select,textarea{font-size:16px}
  nav.tabs button{padding:12px 10px 13px}
}
/* V6: drag to reorder, filter panel, recency legend */
.dragrow{border-radius:14px;transition:outline-color .1s}
.dragrow.dragging{opacity:.45}
.dragrow.dragover{outline:2px dashed #2e7d32;outline-offset:2px}
.dragrow .mv{padding:0 4px 8px;gap:6px}
.exmore{background:#f6f8f4;border-radius:14px;padding:10px 12px;margin:8px 0}
.exmore select{margin-bottom:6px}

/* ================= V17 design pass: one palette for light and dark, new side panel, menu, dialogs ================= */
:root{--card:#fff;--hover:#f0f1ec;--ring:rgba(31,94,44,.18);--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);--accent:#1f5e2c;--accent-ink:#fff;--warnbg:#fff4e5;--warnink:#7a3e00;--okbg:#e7f5ea;--okink:#1b6b31;--infobg:#e8f0fb;--infoink:#1e4f86;--dangerbg:#fdecec}
html[data-theme=dark]{--card:#25292c;--hover:#2d3235;--ring:rgba(174,240,127,.18);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--accent:#aef07f;--accent-ink:#111;--warnbg:#3b3022;--warnink:#ffd8a8;--okbg:#1f3526;--okink:#a7e3b4;--infobg:#1f2f40;--infoink:#a9cdf5;--dangerbg:#3b2226}
html[data-theme=dark] body{background:#111}
input,select,textarea{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.dangerfill{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.danger{color:#dc2626}
html[data-theme=dark] .btn.danger{color:#ff8a8a}
.btn.wide{background:var(--soft);color:var(--ink)}
.btn.wide:hover{background:var(--hover)}
.chips button{background:var(--card);color:var(--ink);border-color:var(--line)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exmore{background:var(--soft)}
.seg .m{color:var(--muted)}
.banner{background:var(--warnbg);color:var(--warnink)}
.badge.been{background:var(--okbg);color:var(--okink)}
.own.orig{background:var(--infobg);color:var(--infoink)}.own.mine{background:var(--okbg);color:var(--okink)}
.bases button{background:var(--card);color:var(--ink)}
#collapseBtn{background:var(--bg);color:var(--ink);border-color:var(--line)}
#viewCtl button{background:var(--bg);color:var(--ink)}
.pop,#menu{background:var(--bg);color:var(--ink)}
.ph-x{background:var(--card);color:var(--ink)}
.notice{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.notice.warn{background:var(--warnbg);color:var(--warnink)}.notice.ok{background:var(--okbg);color:var(--okink)}.notice.info{background:var(--infobg);color:var(--infoink)}
.chart svg path[fill="#f2f2ee"]{fill:var(--soft)}
html[data-theme=dark] .maplibregl-ctrl-group{background:var(--bg)}
html[data-theme=dark] .maplibregl-ctrl-group button+button{border-top-color:var(--line)}
html[data-theme=dark] .maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1)}
html[data-theme=dark] .maplibregl-ctrl-scale{background:rgba(29,32,34,.8);color:var(--ink);border-color:var(--ink)}
html[data-theme=dark] .maplibregl-ctrl-attrib{background:rgba(29,32,34,.9);color:var(--muted)}
html[data-theme=dark] .maplibregl-ctrl-attrib a{color:var(--ink)}

/* Map buttons: the one whose panel is open is filled, so you always know where you are */
.mapbtn{background:var(--bg);color:var(--ink);transition:background .15s,color .15s,box-shadow .15s}
.mapbtn svg{stroke:currentColor}
.mapbtn.on{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px var(--ring),0 2px 10px rgba(0,0,0,.25)}
.mapbtn.on:hover{background:var(--ink)}
#statsBtn{left:414px;right:auto;transition:left .25s ease,background .15s}
body.collapsed #statsBtn{left:14px}
#markersBtn{right:118px}

/* Side panel */
#side{background:var(--bg)}
#side header{padding:18px 20px 6px;gap:12px}
#side header .logo{width:40px;height:40px;border-radius:11px;object-fit:cover;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#side header h1{font-size:19px;line-height:1.1;margin:0;letter-spacing:-.015em}
.brand{flex:1;min-width:0}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{padding:8px 16px 10px}
.search input{border-radius:12px;padding:11px 36px 11px 40px;background:var(--soft);border:1px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s}
.search input:focus{background:var(--card);border-color:var(--line);box-shadow:0 0 0 4px var(--ring)}
.search svg{position:absolute;left:30px;top:21px;color:var(--muted)}
#qClear{position:absolute;right:24px;top:15px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:13px}
#qClear:hover{background:var(--hover)}
nav.tabs{margin:0 16px 8px;padding:4px;gap:4px;border:0;background:var(--soft);border-radius:13px}
nav.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border:0;border-radius:10px;color:var(--muted);font-weight:650;font-size:13.5px;position:relative;transition:background .15s,color .15s}
nav.tabs button svg{flex:none;opacity:.85}
nav.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs button:hover:not(.on){color:var(--ink)}
.tabdot{position:absolute;top:5px;right:10px;width:8px;height:8px;border-radius:50%;background:#ea580c;box-shadow:0 0 0 2px var(--soft)}
#sideBody{padding:0 16px 120px}
h2.sec{font-size:17px;letter-spacing:-.01em;margin:22px 0 6px}
h3.sec{font-size:11.5px;margin:18px 0 6px}
.card{padding:9px 10px;margin:2px -10px;border-bottom:0;border-radius:14px;transition:background .12s}
.card:hover{background:var(--hover)}
.card .ic{width:44px;height:44px;border-radius:12px;font-size:21px}
.card .t{font-size:14.5px}
.card .s{font-size:12.5px}
.card .chev{color:var(--muted);font-size:18px;flex:none}
.chips{gap:6px;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:6px 12px;font-size:12.5px;border-radius:999px}
.row .btn{border-radius:12px}
.d-title{font-size:26px}
.d-title.edit{border:1px solid transparent;border-radius:10px;padding:2px 6px;margin-left:-7px;outline:none;cursor:text;background:transparent;width:calc(100% + 7px);font:inherit;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.d-title.edit:hover{border-color:var(--line)}
.d-title.edit:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring);background:var(--card)}
.d-head{display:flex;align-items:center;gap:12px;margin:8px 0 2px}
.d-head .emobig{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;border:0;cursor:pointer;position:relative}
.d-head .emobig:after{content:'✎';position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.d-head .emobig.static{cursor:default}.d-head .emobig.static:after{display:none}
.d-head>div{flex:1;min-width:0}
.stpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink)}
.stpill i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.linkrow{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 6px}
.linkrow button{border:0;background:none;padding:4px 0;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.linkrow button:hover{color:var(--ink)}
.linkrow button.on{color:var(--accent)}
html[data-theme=light] .linkrow button.on,:root:not([data-theme=dark]) .linkrow button.on{color:#15803d}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;margin:4px 0}
.kv>div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{word-break:break-word}
.kv .v input{padding:5px 8px;font-size:13.5px}
.seg2{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:6px 0}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:650;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg2 button i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.2)}

/* Menu */
#menu{width:318px;padding:8px 8px 10px;border-radius:18px}
.menu-h{display:flex;align-items:center;gap:10px;padding:8px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-h b{font-size:15px}.menu-h .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo.sm{width:32px;height:32px;border-radius:9px;object-fit:cover;flex:none}
.vchip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.vchip:hover{background:var(--hover)}
#menu .mh{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 3px}
#menu .menu-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:11px;color:var(--ink)}
#menu .menu-i:hover{background:var(--hover)}
#menu .menu-i svg{flex:none;color:var(--muted)}
#menu .menu-i>span{flex:1;min-width:0}
#menu .menu-i b{font-weight:600;font-size:14px;display:block}
#menu .menu-i .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:0}
.mbadge{background:#ea580c;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}
.mdot{width:8px;height:8px;border-radius:50%;background:#ea580c}
.segbtn{display:flex;gap:3px;background:var(--soft);border-radius:12px;padding:3px;margin:4px 8px 6px}
.segbtn button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px;font-weight:650;font-size:13px;color:var(--muted)}
.segbtn button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Dialogs */
#dlg{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:dlgf .12s ease}
@keyframes dlgf{from{opacity:0}to{opacity:1}}
.dlg-card{background:var(--bg);color:var(--ink);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:20px;width:min(380px,100%);max-height:calc(100vh - 32px);overflow:auto;animation:dlgu .16s ease}
.dlg-card.wide{width:min(460px,100%)}
@keyframes dlgu{from{transform:translateY(8px) scale(.98)}to{transform:none}}
.dlg-t{font-size:17px;font-weight:800;letter-spacing:-.01em}
.dlg-b{color:var(--muted);margin-top:6px;font-size:13.5px}
.dlg-card>input{margin-top:12px}
.dlg-a{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg-a .btn{border-radius:12px;padding:9px 18px}

/* Emoji and color pickers */
.emorow{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.emo{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:var(--soft);font-size:19px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.emo:hover{transform:scale(1.12);background:var(--hover)}
.emo.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.emo.more{font-size:18px;font-weight:700;color:var(--muted);border:1px dashed var(--line);background:transparent}
.emolist{max-height:300px;overflow:auto;margin:10px 0}
.emocat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.emogrid .emo{width:100%;height:40px}
.emohint{min-height:18px}
.swatches{align-items:center}
.swatches button{width:28px;height:28px;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.cpick{display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative;padding:2px 10px 2px 2px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:650}
.cpick:hover{background:var(--hover)}
.cpick.on{border-color:var(--ink)}
.cring{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444)}
.cring[style*="--c"]{background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.cpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}

/* Bottom bar: labels always visible */
#toolbar{background:rgba(21,21,21,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);gap:4px;padding:7px 10px;border-radius:22px}
#toolbar:not(.ctx) button{width:62px;height:56px;border-radius:15px;background:transparent;flex-direction:column;gap:3px}
#toolbar:not(.ctx) button:hover{background:#2c2c2c}
#toolbar:not(.ctx) button.on{background:var(--lime);color:#111}
#toolbar:not(.ctx) button span{position:static;opacity:1;background:none;padding:0;font-size:10.5px;font-weight:650;color:inherit;bottom:auto}
#toolbar:not(.ctx) button[data-mode=upload]{color:#aef07f}
#toolbar:not(.ctx) button[data-mode=upload].on{color:#111}
.modebar{position:absolute;z-index:7;left:calc(200px + 50%);transform:translateX(-50%);bottom:104px;background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;font-weight:600;white-space:nowrap}
body.collapsed .modebar{left:50%}

/* Map credits (i) button: same column and size as the zoom buttons, and it opens upward above the bottom bar */
.maplibregl-ctrl-bottom-right{z-index:7}
.maplibregl-ctrl-bottom-right>.maplibregl-ctrl{margin:0 14px 10px 0}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib.maplibregl-compact{width:29px;height:29px;min-height:29px;padding:0;border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.1);background:var(--bg);position:relative;margin-bottom:14px}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-button{top:2px;right:2px;left:auto;bottom:auto}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-inner{display:none}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner{display:block;position:absolute;right:0;bottom:36px;width:max-content;max-width:min(300px,70vw);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:11px;line-height:1.5;white-space:normal;text-align:left}
html[data-theme=dark] .maplibregl-ctrl-attrib-button{filter:invert(1)}

/* Layers shelf */
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .lname{flex:1;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}
.lrow .lsw{width:30px;height:0;border-top-width:3px;border-top-style:dashed;flex:none}
.lrow .lchev{color:var(--muted);transition:transform .15s;font-size:16px}
.lrow.open .lchev{transform:rotate(90deg)}
.bstyle{background:var(--soft);border-radius:12px;padding:4px 12px 10px;margin:0 0 8px}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;cursor:pointer}

function parseGPX(text, filename) {

      if (r.pts.length > 1) segments.push({ src: 'garmin', pts: simplify(r.pts, 0.00002) });

}

function toGPX(name, lines, wpts, names) {

  for (const t of data.tracks) {

    const k = (t.date || '').slice(0, 4); if (!k) continue;
    const st = trackStatsSafe(t), r = y(k); r.hikes++; r.m += st.len; r.gainM += st.gain; r.nights += t.nights || 0;

const tbb = (act, ic, label, o) => { o = o || {}; return `<button data-tb="${act}" class="${o.on ? 'on' : ''}${o.pri ? ' pri' : ''}${o.snap ? ' snapon' : ''}" ${o.dis ? 'disabled' : ''} title="${esc(o.title || label)}"><i>${ic}</i><em>${label}</em></button>`; };

function tbAction(a) {

    case 'outback': edOutBack(); break;
    case 'splitday': if (editor && editor.wps.length > 1) { const w = editor.wps[editor.wps.length - 1]; if (editor.wps.length - 1 > 0 && w) { w.brk = !w.brk; redrawEditor(); renderSide(); toast(w.brk ? 'Day ends at your last point. Keep clicking to start the next day.' : 'Day break removed.', 3500); } } break;

  };
  map.on('style.load', startOverlays);
  const closeAttrib = () => { const c = document.querySelector('.maplibregl-ctrl-attrib'); if (c) { c.classList.remove('maplibregl-compact-show'); c.removeAttribute('open'); } };
  setTimeout(closeAttrib, 300); setTimeout(closeAttrib, 1500);
  map.on('load', () => {
    closeAttrib();
    startOverlays();
    try { addContours(); applyLayerVisibility(); } catch (e) { console.warn('Contours unavailable', e); }
  });
  setTimeout(() => { if (!overlaysDone && map.isStyleLoaded()) startOverlays(); }, 3000);
  map.on('mousedown', stopPreview); map.on('wheel', stopPreview);
  map.on('mousemove', e => {
    if (!mapReady || mode !== 'browse') return;
    const hit = map.queryRenderedFeatures([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]], { layers: HIT.filter(l => map.getLayer(l)) });
    map.getCanvas().style.cursor = hit.length ? 'pointer' : '';
  });
  map.on('click', e => {
    if (!mapReady) return;
    const ll = [e.lngLat.lng, e.lngLat.lat];
    if (mode === 'pin') {
      const p = { id: uid(), lon: +ll[0].toFixed(6), lat: +ll[1].toFixed(6), name: '', type: 'other', status: 'been', note: '', date: today(), icon: '', color: '' };
      data.pins.push(p); setMode('browse'); touch({ noRender: true }); openDetail({ type: 'pin', id: p.id });
      elevations([ll]).then(el => { if (el[0] != null && !p.note) { p.note = `Elevation about ${fmtFt(el[0])} ft.`; touch({ noRender: true }); if (view.detail && view.detail.id === p.id) renderSide(); } });
      return;
    }
    if (areaEd) {
      const mid = map.getLayer('areaedit-mid') ? map.queryRenderedFeatures([[e.point.x - 8, e.point.y - 8], [e.point.x + 8, e.point.y + 8]], { layers: ['areaedit-mid'] }) : [];
      if (mid.length) areaInsertAt(+mid[0].properties.i, ll); else addAreaPt(ll);
      return;
    }
    if (hed) { hedMapClick(ll); return; }
    if (editor) { addPoint(ll); return; }
    const box = [[e.point.x - 7, e.point.y - 7], [e.point.x + 7, e.point.y + 7]];
    if (mode === 'split') {
      const h = map.queryRenderedFeatures(box, { layers: ['track-hit'] }).filter(f => f.properties.src === 'garmin').sort((a, b) => (b.properties.sel ? 1 : 0) - (a.properties.sel ? 1 : 0));
      if (h.length) splitAt(h[0].properties.tid, +h[0].properties.si, ll[0], ll[1]); else toast('Click right on the hike line recorded by your watch.', 3000);
      return;
    }
    for (const l of HIT) {
      if (!map.getLayer(l) || map.getLayoutProperty(l, 'visibility') === 'none') continue;
      const h = map.queryRenderedFeatures(box, { layers: [l] }); if (!h.length) continue;
      const pr = h[0].properties;
      if (l === 'route-line') return openDetail({ type: 'route', id: pr.rid });
      if (l === 'track-hit') return openDetail({ type: 'track', id: pr.tid });
      if (l === 'trail-hit') return openDetail({ type: 'feature', id: WAY2GROUP[pr.id] || pr.id });
      if (l === 'area-fill') return openDetail({ type: 'area', id: pr.id });
      return openDetail({ type: 'feature', id: pr.id });
    }
    if (view.detail && view.detail.type !== 'editor') { view.detail = null; viewStack = []; selectedPinId = null; renderSide(); updateSources(); }
  });
}

// ================= Startup =================
// Installable app shell (serves the page when offline; map tiles still need a connection)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
(async function start() {
  try {
    const local = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (local && local.data && (local.savedAt || 0) > (data.editedAt || 0)) {
      const osm = data.osm, photos = data.photos; data = normalize(Object.assign({}, local.data, { osm, photos: local.refs || photos })); dirty = true;
      setTimeout(() => toast(window.matchMedia('(max-width:800px)').matches ? 'Restored your latest changes on this device.' : 'Restored your latest changes from this browser. Save the file to keep them in it.', 7000), 800);
    }
  } catch (e) { /* ignore */ }
  if (!(data.osm && data.osm.features && data.osm.features.length)) { const cached = await idbGet('osm'); if (cached && cached.features) data.osm = cached; }
  indexFeatures(); migrateV17();
  await pmLoad();
  applyTheme();
  if (window.maplibregl) initMap(); else toast('The map engine could not load. Connect to the internet and reload.', 0);
  if ((!data.parkOutline || data.parkSrc !== 'nps') && navigator.onLine) fetchParkOutline(true).catch(() => { /* unreachable: keeps what it has, retried next start */ });   // also replaces older outlines that were not from the official source
  if (data.settings.collapsed === undefined && window.matchMedia('(max-width:800px)').matches) data.settings.collapsed = true;
  if (data.settings.collapsed) setCollapsed(true);
  updateSaveState(); renderSide(); tcObserve(); applyTitleCase($('side'));
  if (map) { map.on('move', () => { if (view.detail && view.detail.type === 'print') updatePrintFrame(); }); window.addEventListener('resize', updatePrintFrame); }
  if (syncOn()) { syncStatus(syncIdle()); syncNow(); } else updateSyncBanner();
  if (!FEATS.length) setTimeout(() => { if (!FEATS.length) toast('No trail data on this device yet.', 0, { label: 'Download now', run: () => onAction('fetchAll') }); }, 1500);
  // Find unnamed peaks in the terrain once (quietly); Layers → Show on Map → Scan Again redoes it
  if (FEATS.length && !data.identified && navigator.onLine) setTimeout(() => { if (!data.identified) identifyPeaks({ quiet: true, render: true }).catch(() => { /* offline: try next time */ }); }, 8000);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
})();
</script>
