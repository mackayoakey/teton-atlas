<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teton Atlas V9</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5e2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teton Atlas">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
<style>
:root{--ink:#1b1b1b;--muted:#6b6f6b;--line:#e7e7e3;--bg:#fff;--soft:#f4f4f1;--green:#1f5e2c;--lime:#aef07f;--pill:#151515;--red:#d62828;--orange:#f77f00;--blue:#1e88e5}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#ddd}
#map{position:absolute;top:0;bottom:0;left:400px;right:0;transition:left .25s ease}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body,#side,.pop,#toolbar,#toast,.mapbtn,#collapseBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select,#sideBody p,#sideBody .t,#sideBody textarea{-webkit-user-select:text;user-select:text}
input,select,textarea{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}

/* Sidebar */
#side{position:absolute;top:0;bottom:0;left:0;width:400px;background:var(--bg);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:5;transition:transform .25s ease}
#collapseBtn{position:absolute;z-index:6;top:50%;left:400px;transform:translateY(-50%);width:24px;height:56px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:#fff;box-shadow:3px 0 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:left .25s ease;padding:0}
#collapseBtn svg{transition:transform .25s ease}
body.collapsed #side{transform:translateX(-100%)}
body.collapsed #map{left:0}
body.collapsed #collapseBtn{left:0}
body.collapsed #collapseBtn svg{transform:rotate(180deg)}
body.collapsed #toolbar,body.collapsed #toast{left:50%}
#menu .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
@media print{
  #map,#toolbar,#menu,#layers,#menuBtn,#layersBtn,#collapseBtn,#toast,nav.tabs,.search,#side header,.actions,.back,.btn,.x,.ph-x,.chips,.photos,.stats .muted{display:none!important}
  #side{position:static!important;width:auto!important;height:auto!important;border:0!important;transform:none!important;display:block!important;background:#fff}
  html,body{height:auto!important;overflow:visible!important;background:#fff}
  #sideBody{overflow:visible!important;padding:0!important}
}
.ph-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:16px;line-height:1;padding:0}
#menu .mh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 12px 2px}
#side header{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
#side header svg{flex:none}
#side header h1{font-size:20px;margin:0;letter-spacing:-.01em}
.chip-v{font-size:11px;background:var(--soft);border-radius:999px;padding:2px 8px;color:var(--muted)}
.search{padding:6px 20px 10px;position:relative}
.search input{border-radius:999px;padding:10px 16px 10px 38px;background:var(--soft);border-color:transparent}
.search svg{position:absolute;left:34px;top:18px}
nav.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#sideBody{flex:1;overflow:auto;padding:0 20px 120px}

/* Generic pieces */
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#174a22}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111}
.btn.wide{display:block;width:100%;text-align:center;background:#e9e9e6;border:0;padding:14px;font-size:16px;margin:14px 0}
.btn.wide:hover{background:#dededa}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2.sec{font-size:20px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.empty{color:var(--muted);padding:18px 0}

/* List cards */
.card{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover{background:linear-gradient(90deg,transparent,var(--soft),transparent)}
.card .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.card .tx{flex:1;min-width:0}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px}
.badge{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.badge.been{background:#e5f6e8;color:#1b7a34}
.badge.seen{background:#fff1e0;color:#b45309}
.badge.want{background:#fde8ec;color:#c2185b}

/* Detail page */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:14px 0 4px;color:var(--muted);font-weight:600}
.d-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.d-sub{color:var(--muted);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:10px;margin:16px 0 34px}
.stats.three{grid-template-columns:repeat(3,auto)}
.stat b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat b small{font-size:15px;font-weight:600;margin-left:3px}
.stat div{color:var(--muted);font-size:13px;margin-top:2px}
.chart{position:relative;margin:4px 0 0}
.chart svg{width:100%;height:190px;display:block;overflow:visible}
.chart .tip{position:absolute;top:-6px;background:var(--pill);color:#fff;font-size:12px;border-radius:8px;padding:3px 8px;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.seg{display:flex;gap:12px;padding:12px 0}
.seg i{flex:none;width:5px;border-radius:4px}
.seg .n{font-size:17px;font-weight:600}
.seg .m{display:flex;flex-wrap:wrap;gap:14px;color:#444;margin-top:2px}
.actions{display:flex;justify-content:center;gap:14px;background:var(--pill);border-radius:999px;padding:10px 16px;margin:14px auto;width:max-content}
.actions button{width:52px;height:52px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center}
.actions button:hover{background:#3a3a3a}
.actions button.on,.actions button.go{background:var(--lime);color:#111}
.visit{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.visit .tx{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{background:var(--soft);border-radius:14px;padding:14px}
.tile b{font-size:24px;font-weight:800;display:block}
.tile span{font-size:12px;color:var(--muted)}
.yr{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.wp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.wp .num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.wp .num.brk{background:var(--orange)}
.toggle{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:500}
.toggle input{width:auto}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.history li{margin:4px 0}

/* Map overlays */
.mapbtn{position:absolute;z-index:6;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.mapbtn:hover{background:var(--soft)}
#menuBtn{right:14px}
#layersBtn{right:66px}
.pop{position:absolute;z-index:7;top:66px;right:14px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:14px;max-height:calc(100vh - 90px);overflow:auto}
#menu{width:260px;padding:8px}
#menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:500}
#menu button:hover{background:var(--soft)}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#layers{width:300px}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bases button{border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 0 6px;font-size:12px;font-weight:600;overflow:hidden}
.bases button i{display:block;height:46px;margin-bottom:5px}
.bases button.on{border-color:var(--green)}
#toolbar{position:absolute;z-index:6;bottom:22px;left:calc(200px + 50%);transform:translateX(-50%);transition:left .25s ease;display:flex;gap:10px;background:var(--pill);border-radius:999px;padding:9px 12px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toolbar button{width:50px;height:50px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
#toolbar button:hover{background:#3a3a3a}
#toolbar button.on{background:var(--lime);color:#111}
#toolbar button span{position:absolute;bottom:-26px;font-size:11px;color:#fff;background:var(--pill);padding:1px 6px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap}
#toolbar button:hover span{opacity:1}
#toast{position:absolute;z-index:8;top:16px;left:calc(200px + 50%);transform:translateX(-50%);background:var(--pill);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;max-width:60vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.pin span{transform:rotate(45deg);font-size:15px;line-height:1}
.pin.sel{outline:3px solid var(--lime)}
.wpm{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:grab}
.wpm.first{border-color:var(--green)}
.wpm.brk{border-color:var(--orange);width:20px;height:20px}
.maplibregl-ctrl-bottom-right{bottom:0}
#toast .tact{margin-left:10px;border:0;border-radius:999px;background:var(--lime);color:#111;font-weight:700;padding:5px 12px}
#toast .tx{display:inline-block;margin-left:8px;opacity:.7;font-size:16px;vertical-align:middle}
@media (max-width:800px){
  :root{--sheet:46vh;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
  @supports (height:1dvh){:root{--sheet:46dvh}}
  html,body{height:100%}
  @supports (height:1dvh){html,body{height:100dvh}}
  #side{top:auto;bottom:0;width:100%;height:var(--sheet);border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0}
  #map{left:0;bottom:var(--sheet);transition:bottom .25s ease}
  #sideBody{padding-bottom:calc(120px + var(--sab))}
  /* The tool bar sits well above the handle so it never covers the hide/show arrow */
  #toolbar{left:50%;bottom:calc(var(--sheet) + 40px);gap:8px;padding:7px 9px}
  #toolbar button{width:46px;height:46px}
  .mapbtn{top:calc(12px + var(--sat))}
  .pop{top:calc(66px + var(--sat));max-height:calc(100vh - 90px - var(--sat) - var(--sab))}
  @supports (height:1dvh){.pop{max-height:calc(100dvh - 90px - var(--sat) - var(--sab))}}
  #layers{width:min(300px,calc(100vw - 28px))}
  #toast{left:50%;top:calc(68px + var(--sat));max-width:88vw;border-radius:18px}
  /* Handle: a larger tap target that sits on the top edge of the sheet */
  #collapseBtn{top:auto;left:50%;bottom:var(--sheet);transform:translateX(-50%);width:72px;height:30px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;transition:bottom .25s ease;z-index:7}
  #collapseBtn svg{transform:rotate(-90deg)}
  body.collapsed #side{transform:translateY(100%)}
  body.collapsed #map{left:0;bottom:0}
  body.collapsed #collapseBtn{left:50%;bottom:var(--sab)}
  body.collapsed #collapseBtn svg{transform:rotate(90deg)}
  body.collapsed #toolbar{bottom:calc(var(--sab) + 44px)}
  /* 16px inputs stop iOS from zooming the page when a field is focused */
  input,select,textarea{font-size:16px}
  nav.tabs button{padding:12px 10px 13px}
  #side header{padding-top:12px}
}
/* V6: drag to reorder, filter panel, recency legend */
.dragrow{border-radius:14px;transition:outline-color .1s}
.dragrow.dragging{opacity:.45}
.dragrow.dragover{outline:2px dashed #2e7d32;outline-offset:2px}
.dragrow .mv{padding:0 4px 8px;gap:6px}
.exmore{background:#f6f8f4;border-radius:14px;padding:10px 12px;margin:8px 0}
.exmore select{margin-bottom:6px}
</style>
</head>
<body>
<aside id="side">
  <header>
    <svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#1f5e2c"/><path d="M4 26 L13 12 L16 16 L20 7 L30 26 Z" fill="#fff"/><path d="M20 7 L17.5 12 L19.5 11 L21.5 13 Z" fill="#aef07f"/></svg>
    <h1>Teton Atlas</h1><span class="chip-v">V9</span>
  </header>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6f6b" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search trails, peaks, lakes, routes" autocomplete="off">
  </div>
  <nav class="tabs">
    <button data-tab="explore" class="on">Explore</button>
    <button data-tab="routes">Routes</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <div id="sideBody"></div>
</aside>

<button id="collapseBtn" title="Hide panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<div id="map"></div>

<button id="layersBtn" class="mapbtn" title="Map layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
<button id="menuBtn" class="mapbtn" title="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<div id="menu" class="pop" hidden>
  <button data-menu="save"><span>Save file</span></button>
  <hr>
  <div class="mh">Import</div>
  <button data-menu="gpx"><span>Import GPX hikes<span class="sub">Garmin Connect: open an activity → ⚙ → Export to GPX</span></span></button>
  <button data-menu="importOld"><span>Import from an older version<span class="sub">Pick your old Teton Atlas file (V1, V2, V3…)</span></span></button>
  <button data-menu="importJson"><span>Import a backup (JSON)</span></button>
  <hr>
  <div class="mh">Map data</div>
  <button data-menu="fetchAll"><span>Download trails &amp; places (whole range)</span></button>
  <button data-menu="fetchView"><span>Add trails &amp; places for this view</span></button>
  <hr>
  <button data-menu="ideas"><span>Ideas (Sooner &amp; Later)</span></button>
  <button data-menu="exportJson"><span>Export full backup (JSON)<span class="sub">Includes photos, ideas and ratings</span></span></button>
  <button data-menu="pngMap"><span>Export map view (PNG)</span></button>
  <button data-menu="pdfMap"><span>Map view as PDF<span class="sub">Opens the print dialog; choose "Save as PDF"</span></span></button>
  <button data-menu="offline"><span>Offline terrain (download)</span></button>
  <button data-menu="printPdf"><span>Stats &amp; checklist as PDF<span class="sub">Opens the print dialog; choose "Save as PDF"</span></span></button>
  <button data-menu="settings"><span>Settings</span></button>
  <button data-menu="history"><span>Version history</span></button>
  <button data-menu="help"><span>How to use</span></button>
</div>

<div id="layers" class="pop" hidden></div>

<div id="toolbar">
  <button data-mode="browse" class="on" title="Browse"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7 16 2-7 7-2z"/></svg><span>Browse</span></button>
  <button data-mode="route" title="Build a route"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 000-6H9a3 3 0 010-6h6.5"/></svg><span>Build route</span></button>
  <button data-mode="track" title="Log a hike by drawing it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span>Draw hike</span></button>
  <button data-mode="pin" title="Drop a pin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Drop pin</span></button>
  <button id="btn3d" title="3D view"><b style="font-size:15px">3D</b><span>3D terrain</span></button>
</div>

<div id="toast" hidden></div>
<input type="file" id="gpxFile" accept=".gpx" multiple hidden>
<input type="file" id="oldFile" accept=".html,.htm" hidden>
<input type="file" id="jsonFile" accept=".json" hidden>
<input type="file" id="photoFile" accept="image/*" multiple hidden>

<script type="application/json" id="embedded-data">{"version":3,"editedAt":0,"visits":{},"names":{},"tracks":[],"pins":[],"routes":[],"wish":{},"settings":{},"osm":null}</script>
<script>
'use strict';
// ================= Config =================
const APP_VERSION = 'V9';
const BBOX = { s: 43.40, w: -111.25, n: 44.15, e: -110.50 }; // whole Teton Range, WY + ID sides
const OVERPASS_URLS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const DEM_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const DEM_Z = 14;
const DEM_PROTO = 'teton-dem://'; // terrain tiles go through this so downloaded copies are used offline
const DEM_CACHE = 'teton-dem-offline';
const OFF_LEVELS = { low: { label: 'Low', zooms: [10, 11] }, medium: { label: 'Medium', zooms: [10, 11, 12, 13] }, high: { label: 'High', zooms: [10, 11, 12, 13, 14] } };
const OFF_TILE_KB = 25; // rough average for one terrain tile, shown as an estimate only
const OFF_MAX_TILES = 4000;
const LS_KEY = 'teton-atlas-v1'; // shared with V1/V2 so unsaved data carries forward
const IDB_NAME = 'teton-atlas';
const FONT = ['Noto Sans Bold'];

  for (const url of OVERPASS_URLS) {
    try {
      const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}
function overpassQuery(s, w, n, e) {
  const bb = `(${s.toFixed(4)},${w.toFixed(4)},${n.toFixed(4)},${e.toFixed(4)})`;
  const wf = '["water"!~"^(river|stream|canal|ditch|wastewater|stream_pool)$"]';
  return `[out:json][timeout:240];(` +
    `way["highway"~"^(path|footway|track|bridleway|steps)$"]["footway"!~"^(sidewalk|crossing)$"]["access"!~"^(private|no)$"]${bb};` +
    `node["natural"~"^(peak|volcano|saddle)$"]${bb};node["mountain_pass"="yes"]${bb};node["waterway"="waterfall"]${bb};` +
    `way["natural"="water"]${wf}${bb};relation["natural"="water"]${wf}${bb};` +
    `);out geom;`;
}
async function fetchArea(s, w, n, e, bands) {
  const h = (n - s) / bands, byId = new Map();
  for (let i = 0; i < bands; i++) {
    toast(`Downloading map data… ${i + 1} of ${bands}`, 0);
    const json = await overpass(overpassQuery(s + i * h, w, s + (i + 1) * h, e));
    for (const el of json.elements) byId.set(el.type + '/' + el.id, el);
  }
  const fresh = buildFeatures([...byId.values()]);
  const merged = new Map(((data.osm && data.osm.features) || []).map(f => [f.id, f]));
  for (const f of fresh) merged.set(f.id, f);
  data.osm = { fetchedAt: Date.now(), features: [...merged.values()] };
  indexFeatures();
  for (const t of data.tracks) matchTrack(t);
  await idbPut('osm', data.osm);
  touch();
  toast(`Map data ready: ${FEATS.length.toLocaleString()} trails, peaks, lakes and more.`);
}

// ================= IndexedDB cache (so map data survives reloads before saving) =================
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

}
async function idbPut(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* cache is optional */ } }

// ================= Indexing, trail groups, routing graph =================
const nameOf = f => (data.names[f.id] || f.name || '');
function indexFeatures() {
  FEAT = {}; FEATS = []; PGRID = new Map();

    if (f.kind === 'lake' && !f.polys && f.ring) f.polys = [f.ring]; // V1/V2 cached format
    if (f.kind === 'lake') { f.bb = bboxOf(f.polys.flat()); f.center = ringCentroid(f.polys[0]); }
    if (f.kind === 'trail') { f.bb = bboxOf(f.coords); f.len = lineLen(f.coords); }

// Group connected trail ways that share a name, so a named trail behaves as one trail

  for (const [name, ways] of Object.entries(byName)) {
    const parent = ways.map((_, i) => i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    const endKey = new Map();
    ways.forEach((w, i) => {
      for (const p of [w.coords[0], w.coords[w.coords.length - 1]]) {
        const k = p[0] + ',' + p[1];
        if (endKey.has(k)) parent[find(i)] = find(endKey.get(k)); else endKey.set(k, i);

    for (const list of Object.values(clusters)) {

// Try to order a group's ways into one continuous line (for a single elevation profile)
function chainGroup(g) {

  let startIdx = ways.findIndex(w => deg.get(key(w[0])) === 1 || deg.get(key(w[w.length - 1])) === 1);
  if (startIdx < 0) return (g.chain = null);
  const pool = ways.slice(); let cur = pool.splice(startIdx, 1)[0];
  if (deg.get(key(cur[0])) !== 1) cur = cur.slice().reverse();
  while (pool.length) {
    const end = key(cur[cur.length - 1]);
    const i = pool.findIndex(w => key(w[0]) === end || key(w[w.length - 1]) === end);
    if (i < 0) return (g.chain = null);
    let nx = pool.splice(i, 1)[0]; if (key(nx[0]) !== end) nx = nx.slice().reverse();

      const cur = node(f.coords[i]);
      if (cur !== prev) { const w = dist(lat[prev], lon[prev], lat[cur], lon[cur]); adj[prev].push(cur, w); adj[cur].push(prev, w); }

// Dijkstra along the trail network between two clicked points
function routeBetween(a, b) {
  const s = nearestNode(a[0], a[1], 250), t = nearestNode(b[0], b[1], 250);
  if (s < 0 || t < 0) return null;
  if (s === t) return [[GRAPH.lon[s], GRAPH.lat[s]]];

  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const limit = dist(a[1], a[0], b[1], b[0]) * 6 + 5000;
  while (heap.length) {
    const [d, u] = pop();
    if (u === t) break;
    if (d > D[u] || d > limit) continue;
    const e = GRAPH.adj[u];
    for (let k = 0; k < e.length; k += 2) { const v = e[k], nd = d + e[k + 1]; if (nd < D[v]) { D[v] = nd; P[v] = u; push([nd, v]); } }

// ================= Visits ("been", "seen") and saved list =================
const isGroup = id => id && id.startsWith('tg:');

function visitsFor(id) {

    if (!seen.has(k)) { seen.add(k); out.push(v); }

}
function statusOf(id) {

function addVisit(id, status, date, note) {

// ================= Matching tracks to places =================
function trackSamples(t) {
  const out = [];
  for (const s of t.segments) if (s.src !== 'ignored' && s.pts.length > 1) out.push(...resample(s.pts, 15));
  return out;
}
function sampleGrid(samples) {
  const g = new Map();
  for (const p of samples) { const k = Math.floor(p[1] / 0.0005) + ',' + Math.floor(p[0] / 0.0005); let c = g.get(k); if (!c) g.set(k, c = []); c.push(p); }
  return (lon, lat, r) => {
    const ci = Math.floor(lat / 0.0005), cj = Math.floor(lon / 0.0005), n = Math.ceil(r / 38);
    for (let a = -n; a <= n; a++) for (let b = -n; b <= n; b++) for (const p of g.get((ci + a) + ',' + (cj + b)) || []) if (dist(lat, lon, p[1], p[0]) <= r) return true;
    return false;
  };
}
function matchTrack(t) {
  for (const id of Object.keys(data.visits)) {
    const kept = data.visits[id].filter(v => v.trackId !== t.id);
    if (kept.length) data.visits[id] = kept; else delete data.visits[id];
  }
  const samples = trackSamples(t);
  if (samples.length < 2 || !FEATS.length) return [];
  const near = sampleGrid(samples), tb = bboxOf(samples), hits = [];
  const add = (id, extra) => { (data.visits[id] = data.visits[id] || []).push(Object.assign({ vid: uid(), date: t.date, src: 'track', trackId: t.id, status: 'been', note: '' }, extra)); hits.push(id); };

    if (f.coord) {
      if (f.coord[0] < tb[0] - 0.002 || f.coord[0] > tb[2] + 0.002 || f.coord[1] < tb[1] - 0.002 || f.coord[1] > tb[3] + 0.002) continue;
      if (near(f.coord[0], f.coord[1], f.kind === 'pass' ? 60 : 80)) add(f.id);
    } else if (f.kind === 'trail') {
      if (!bboxHit(f.bb, tb, 0.001)) continue;
      const pts = resample(f.coords, 20); let hit = 0;
      for (const p of pts) if (near(p[0], p[1], 30)) hit++;

      if (hit * 20 >= 200 || (cov >= 0.6 && hit >= 2)) add(f.id, { cov: Math.min(1, cov) });
    } else if (f.kind === 'lake') {
      if (!bboxHit(f.bb, tb, 0.001)) continue;
      let ok = false;
      for (const ring of f.polys) { for (const p of resample(ring, 30)) if (near(p[0], p[1], 60)) { ok = true; break; } if (ok) break; }
      if (!ok) for (const s of samples) if (s[0] >= f.bb[0] && s[0] <= f.bb[2] && s[1] >= f.bb[1] && s[1] <= f.bb[3] && f.polys.some(r => pointInRing(s[0], s[1], r))) { ok = true; break; }
      if (ok) add(f.id);

}

// ================= GPX =================
function parseGPX(text, filename) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const kids = (el, n) => [...el.getElementsByTagName(n)];
  const read = (nodes) => {
    const pts = []; let t0 = null, t1 = null;
    for (const p of nodes) {
      const lat = parseFloat(p.getAttribute('lat')), lon = parseFloat(p.getAttribute('lon'));
      if (isNaN(lat) || isNaN(lon)) continue;
      const e = p.getElementsByTagName('ele')[0], tm = p.getElementsByTagName('time')[0];
      const ele = e ? parseFloat(e.textContent) : NaN;
      if (tm) { const ms = Date.parse(tm.textContent); if (!isNaN(ms)) { if (t0 === null) t0 = ms; t1 = ms; } }
      pts.push([+lon.toFixed(6), +lat.toFixed(6), isNaN(ele) ? null : +ele.toFixed(1)]);
    }
    return { pts, t0, t1 };
  };
  const out = [];
  const make = (el, segNodes) => {
    const nameEl = [...el.children].find(c => c.localName === 'name');
    const name = (nameEl && nameEl.textContent.trim()) || filename.replace(/\.gpx$/i, '');
    const segments = []; let t0 = null, t1 = null;
    for (const nodes of segNodes) {
      const r = read(nodes);
      if (r.t0 !== null && t0 === null) t0 = r.t0; if (r.t1 !== null) t1 = r.t1;
      if (r.pts.length > 1) segments.push({ src: 'garmin', pts: simplify(r.pts, 0.00002) });
    }
    if (segments.length) out.push({ id: uid(), name, date: t0 !== null ? localDate(t0) : today(), start: t0, end: t1, trip: '', notes: '', segments });
  };
  for (const trk of kids(doc, 'trk')) make(trk, kids(trk, 'trkseg').map(s => kids(s, 'trkpt')));
  if (!out.length) for (const rte of kids(doc, 'rte')) make(rte, [kids(rte, 'rtept')]);
  return out;
}
function toGPX(name, lines) {
  const x = s => esc(s);
  const segs = lines.map(l => '<trkseg>' + l.map(p => `<trkpt lat="${p[1]}" lon="${p[0]}">${p[2] != null ? `<ele>${(+p[2]).toFixed(1)}</ele>` : ''}</trkpt>`).join('') + '</trkseg>').join('');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Teton Atlas" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${x(name)}</name></metadata><trk><name>${x(name)}</name>${segs}</trk></gpx>`;
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/octet-stream' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importGPXFiles(files) {
  let added = 0, dup = 0, places = 0, lastId = null;
  for (const f of files) {
    for (const t of parseGPX(await f.text(), f.name)) {
      const n = t.segments.reduce((a, s) => a + s.pts.length, 0);
      if (data.tracks.some(o => o.name === t.name && o.date === t.date && o.segments.reduce((a, s) => a + s.pts.length, 0) === n)) { dup++; continue; }
      // Imports wait in Pending review; places are matched and stats counted once you approve them
      t.approved = false; data.tracks.push(t); added++; lastId = t.id;
    }
  }
  if (added) { touch(); if (added === 1) openDetail({ type: 'track', id: lastId }); else setTab('activity'); }
  toast(added ? `Imported ${added} hike${added > 1 ? 's' : ''}${dup ? ` (${dup} duplicate skipped)` : ''}. Approve ${added > 1 ? 'them' : 'it'} in Activity to count ${added > 1 ? 'them' : 'it'}.` : (dup ? 'Already imported.' : 'No tracks found in that file.'), 8000);

// ================= Modes =================
function setMode(m, keepEditor) {
  if (!keepEditor && editor && m !== 'route' && m !== 'track') stopEditor(true);
  mode = m;
  document.querySelectorAll('#toolbar [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  if (map) { map.getCanvas().style.cursor = m === 'browse' ? '' : 'crosshair'; if (m === 'browse') map.doubleClickZoom.enable(); else map.doubleClickZoom.disable(); }
  if (m === 'pin') toast('Click the map to drop a pin.', 0);
  else if (m === 'split') toast('Click the blue Garmin line where the watch stopped recording.', 0);
  else if (m === 'browse') toast(null);
}
function splitAt(tid, si, lng, lat) {
  const t = findTrack(tid); if (!t) return;
  const s = t.segments[si]; if (!s || s.src !== 'garmin') return;
  // Cut exactly at the clicked spot: project onto the nearest segment and insert a point there
  const k = Math.cos(lat * Math.PI / 180);
  let best = 0, bd = Infinity, bt = 0;
  for (let i = 1; i < s.pts.length; i++) {
    const a = s.pts[i - 1], b = s.pts[i], dx = (b[0] - a[0]) * k, dy = b[1] - a[1], L = dx * dx + dy * dy;
    let u = L ? (((lng - a[0]) * k) * dx + (lat - a[1]) * dy) / L : 0; u = Math.max(0, Math.min(1, u));
    const d = Math.hypot((a[0] + (b[0] - a[0]) * u - lng) * k, a[1] + (b[1] - a[1]) * u - lat);
    if (d < bd) { bd = d; best = i; bt = u; }
  }
  const A = s.pts[best - 1], B = s.pts[best];
  const cut = [+(A[0] + (B[0] - A[0]) * bt).toFixed(6), +(A[1] + (B[1] - A[1]) * bt).toFixed(6), A[2] != null && B[2] != null ? +(A[2] + (B[2] - A[2]) * bt).toFixed(1) : null];
  const before = s.pts.slice(0, best).concat([cut]), after = [cut].concat(s.pts.slice(best));
  t.segments.splice(si, 1, { src: 'garmin', pts: before }, ...(after.length > 1 ? [{ src: 'ignored', pts: after }] : []));
  matchTrack(t); touch({ noRender: true });
  startEditor('extend', { trackId: tid, start: [cut[0], cut[1]] });
  toast('Garmin part ends here. Now click along where you actually went, then Save.', 6000);
}
function unsplit(t) {
  const out = [];
  for (const s of t.segments) {
    if (s.src === 'manual') continue;
    const last = out[out.length - 1];
    if (s.src === 'ignored' && last) last.pts = last.pts.concat(s.pts.slice(1));
    else out.push({ src: 'garmin', pts: s.pts.slice() });
  }
  t.segments = out;
}

// ================= Route preview flythrough =================
let previewing = false;
function previewRoute(coords) {
  if (coords.length < 2) return;
  if (!data.settings.terrain) set3D(true);
  const total = lineLen(coords), pts = resample(coords, Math.max(10, total / 600)), dur = Math.min(45000, Math.max(12000, total / 1.2));
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1][1], pts[i - 1][0], pts[i][1], pts[i][0]));
  const at = d => { let i = cum.findIndex(c => c >= d); if (i <= 0) return pts[Math.max(0, i)]; const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; };
  previewing = true; toast('Previewing route… click the map to stop.', 0);
  let bearing = map.getBearing(), t0 = null;
  const look = Math.min(800, total / 6);
  const frame = ts => {
    if (!previewing) return;
    if (t0 === null) t0 = ts;
    const k = Math.min(1, (ts - t0) / dur), d = k * total, p = at(d), ahead = at(Math.min(total, d + look));
    const target = Math.atan2((ahead[0] - p[0]) * Math.cos(p[1] * Math.PI / 180), ahead[1] - p[1]) * 180 / Math.PI;
    let diff = ((target - bearing + 540) % 360) - 180; bearing += diff * 0.04;
    map.jumpTo({ center: p, bearing, pitch: 62, zoom: 13.6 });
    if (k < 1) requestAnimationFrame(frame); else { previewing = false; toast('Preview finished.'); }
  };
  map.flyTo({ center: coords[0], zoom: 13.6, pitch: 62, duration: 1500 });
  map.once('moveend', () => requestAnimationFrame(frame));
}
function stopPreview() { if (previewing) { previewing = false; toast(null); } }

// Photos: how much space they take in the file, shown in Settings
function photoSummary() {
  const all = Object.values(data.photos).flat(), bytes = all.reduce((a, s) => a + Math.round(s.length * 0.75), 0);
  if (!all.length) return 'No photos yet.';
  return `${all.length} photo${all.length === 1 ? '' : 's'}, about ${(bytes / 1048576).toFixed(1)} MB in this file.`;
}
function shrinkDataURL(src, max) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}
async function recompressPhotos() {
  const max = data.settings.photoMax || 1200;
  let changed = 0, saved = 0;
  toast('Shrinking photos…', 0);
  for (const list of Object.values(data.photos)) for (let i = 0; i < list.length; i++) {
    const small = await shrinkDataURL(list[i], max);
    if (small && small.length < list[i].length) { saved += list[i].length - small.length; list[i] = small; changed++; }
  }
  touch();
  toast(changed ? `Shrank ${changed} photo${changed === 1 ? '' : 's'}, saving about ${(saved * 0.75 / 1048576).toFixed(1)} MB.` : 'No photos needed shrinking.', 6000);
}

      <body><h1>Teton Atlas · ${esc(today())}</h1><p>${esc(legend)}</p><img src="${img}" alt="Map"><script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);

document.addEventListener('keydown', e => {

['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest('#map')) e.preventDefault(); }));
// ================= Collapsible side panel =================

// ================= Offline terrain =================
// Terrain (elevation and hillshade) tiles can be saved on the device. The base map's vector tiles are not
// downloaded here (see the spec): the public vector server is not meant for bulk downloads.
async function demProtocol(req) {
  const m = req.url.match(/^teton-dem:\/\/(\d+)\/(\d+)\/(\d+)/);
  if (!m) throw new Error('bad terrain tile address');
  const url = DEM_URL.replace('{z}', m[1]).replace('{x}', m[2]).replace('{y}', m[3]);
  try { const hit = await (await caches.open(DEM_CACHE)).match(url); if (hit) return { data: await hit.arrayBuffer() }; } catch (e) { /* cache not available here */ }
  const res = await fetch(url);
  if (!res.ok) throw new Error('terrain tile ' + res.status);
  return { data: await res.arrayBuffer() };
}
const lon2x = (lon, z) => Math.floor((lon + 180) / 360 * 2 ** z);
const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
function demTileUrls(b, zooms) {
  const out = [];
  for (const z of zooms) {
    const x0 = lon2x(b.w, z), x1 = lon2x(b.e, z), y0 = lat2y(b.n, z), y1 = lat2y(b.s, z);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push(DEM_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y));
  }
  return out;
}
function viewBounds() { if (!map) return BBOX; const b = map.getBounds(); return { s: b.getSouth(), w: b.getWest(), n: b.getNorth(), e: b.getEast() }; }
let offBusy = false;
function setOffStatus(t) { const el = $('offStatus'); if (el) el.textContent = t; }
async function updateOffStatus() {
  try {
    const keys = await (await caches.open(DEM_CACHE)).keys();
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    setOffStatus(keys.length ? `${keys.length.toLocaleString()} terrain tiles saved on this device${est ? ` · this site uses ${(est.usage / 1048576).toFixed(0)} MB of browser storage` : ''}.` : 'Nothing saved offline yet.');
  } catch (e) { setOffStatus('Offline storage is not available here. Open the app over https (GitHub Pages) to use it.'); }
}
async function downloadOffline(level, area) {
  if (offBusy) { toast('A download is already running.'); return; }
  const L = OFF_LEVELS[level], bnd = area === 'view' ? viewBounds() : BBOX;
  const urls = demTileUrls(bnd, L.zooms);
  if (urls.length > OFF_MAX_TILES) { toast('That area is too big for one offline download. Zoom in, or pick a lower quality.', 8000); return; }
  offBusy = true; let done = 0, fail = 0, next = 0;
  setOffStatus(`Downloading ${urls.length.toLocaleString()} tiles… keep this page open until it says Done.`);
  try {
    const cache = await caches.open(DEM_CACHE);
    const worker = async () => {
      while (next < urls.length) {
        const u = urls[next++];
        try {
          if (!(await cache.match(u))) {
            const res = await fetch(u); if (!res.ok) throw new Error(res.status);
            const buf = await res.arrayBuffer();
            await cache.put(u, new Response(buf, { headers: { 'Content-Type': 'image/png' } }));
          }
        } catch (e) { fail++; }
        done++;
        if (done % 25 === 0 || done === urls.length) setOffStatus(`Downloaded ${done.toLocaleString()} of ${urls.length.toLocaleString()} tiles${fail ? ` (${fail} failed)` : ''}…`);
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    setOffStatus(`Done: ${(urls.length - fail).toLocaleString()} of ${urls.length.toLocaleString()} tiles saved${fail ? `, ${fail} failed. Run it again to retry those` : ''}.`);
    toast(fail ? 'Saved with some failures. Run it again.' : 'Offline terrain saved.', 6000);
  } catch (e) { setOffStatus('Download stopped: ' + e.message); toast('Download failed: ' + e.message, 7000); }
  finally { offBusy = false; updateOffStatus(); }
}
function pageOffline() {
  const rows = Object.entries(OFF_LEVELS).map(([k, L]) => {
    const whole = demTileUrls(BBOX, L.zooms).length, here = demTileUrls(viewBounds(), L.zooms).length;
    const row = (n, area, label) => `<button class="btn sm" data-act="offDl" data-level="${k}" data-area="${area}">${label}: ${n.toLocaleString()} tiles · ~${Math.round(n * OFF_TILE_KB / 1024)} MB</button>`;
    return `<div class="visit" style="flex-direction:column;align-items:stretch"><b>${L.label}</b><span class="small muted">Zoom ${L.zooms[0]}–${L.zooms[L.zooms.length - 1]}</span><div class="row">${row(whole, 'range', 'Whole range')}${row(here, 'view', 'This view')}</div></div>`;
  }).join('');
  return `${backBtn()}<div class="d-title">Offline terrain</div>
    <div class="d-sub">Saves elevation and hillshade for offline use. Trails, peaks, lakes and your hikes already work offline because they are stored in this file.</div>
    <div class="small" id="offStatus">Checking…</div>
    <h2 class="sec">Download</h2>
    ${rows}
    <div class="small muted" style="margin-top:8px">Size is an estimate (about ${OFF_TILE_KB} KB per tile). Keep this page open while it downloads. Contour lines use the saved terrain, so they work offline too. Limits: the base map's colors, roads and labels still need a connection (offline base maps are not built yet), and iPhones may clear site storage if the app is not added to the Home Screen.</div>
    <div class="row"><button class="btn danger" data-act="offClear">Remove offline terrain</button></div>`;
}

// ================= Map init =================
const HIT = ['poi', 'route-line', 'track-hit', 'trail-hit', 'lake-fill'];
function initMap() {
  maplibregl.addProtocol('teton-dem', demProtocol);
  map = new maplibregl.Map({ container: 'map', style: buildStyle(), center: [-110.80, 43.74], zoom: 10.3, maxPitch: 85, hash: true, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), 'bottom-right');
  // Overlays (trails, routes, pins...) are added as soon as the style itself is ready. Waiting for the
  // map's 'load' event is fragile: it only fires once every base-map tile has arrived, so a slow or failing
  // vector-tile request would leave the map without any of your data on it.
  let overlaysDone = false;
  const startOverlays = () => {
    if (overlaysDone) return; overlaysDone = true;
    try { addOverlays(); } catch (e) { console.error('Overlay setup failed', e); }
    mapReady = true;
    try { if (data.settings.terrain) set3D(true); } catch (e) { console.warn(e); }
    try { updateSources(); } catch (e) { console.error(e); }
  };
  map.on('style.load', startOverlays);
  map.on('load', () => {
    startOverlays();
    try { addContours(); applyLayerVisibility(); } catch (e) { console.warn('Contours unavailable', e); }
  });
  setTimeout(() => { if (!overlaysDone && map.isStyleLoaded()) startOverlays(); }, 3000);
  map.on('mousedown', stopPreview); map.on('wheel', stopPreview);
  map.on('mousemove', e => {
    if (!mapReady || mode !== 'browse') return;
    const hit = map.queryRenderedFeatures([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]], { layers: HIT.filter(l => map.getLayer(l)) });
    map.getCanvas().style.cursor = hit.length ? 'pointer' : '';
  });
  map.on('click', e => {
    if (!mapReady) return;
    const ll = [e.lngLat.lng, e.lngLat.lat];
    if (mode === 'pin') {
      const p = { id: uid(), lon: +ll[0].toFixed(6), lat: +ll[1].toFixed(6), name: '', type: 'other', status: 'been', note: '', date: today(), icon: '', color: '' };
      data.pins.push(p); setMode('browse'); touch({ noRender: true }); openDetail({ type: 'pin', id: p.id });
      elevations([ll]).then(el => { if (el[0] != null && !p.note) { p.note = `Elevation about ${fmtFt(el[0])} ft.`; touch({ noRender: true }); if (view.detail && view.detail.id === p.id) renderSide(); } });
      return;
    }
    if (editor) { addPoint(ll); return; }
    const box = [[e.point.x - 7, e.point.y - 7], [e.point.x + 7, e.point.y + 7]];
    if (mode === 'split') {
      const h = map.queryRenderedFeatures(box, { layers: ['track-garmin'] });
      if (h.length) splitAt(h[0].properties.tid, +h[0].properties.si, ll[0], ll[1]); else toast('Click right on a blue Garmin line.', 3000);
      return;
    }
    for (const l of HIT) {
      if (!map.getLayer(l) || map.getLayoutProperty(l, 'visibility') === 'none') continue;
      const h = map.queryRenderedFeatures(box, { layers: [l] }); if (!h.length) continue;
      const pr = h[0].properties;
      if (l === 'route-line') return openDetail({ type: 'route', id: pr.rid });
      if (l === 'track-hit') return openDetail({ type: 'track', id: pr.tid });
      if (l === 'trail-hit') return openDetail({ type: 'feature', id: WAY2GROUP[pr.id] || pr.id });
      return openDetail({ type: 'feature', id: pr.id });
    }
    if (view.detail && view.detail.type !== 'editor') { view.detail = null; viewStack = []; selectedPinId = null; renderSide(); updateSources(); }
  });
}

// ================= Startup =================
// Installable app shell (serves the page when offline; map tiles still need a connection)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
(async function start() {
  try {
    const local = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
